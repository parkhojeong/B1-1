<html>
    <link rel="stylesheet" href="./css/style.css">
    <body>
        Hello, I'm Hojeong.
        <header>
            <nav>
                <a href="#projects">View Projects</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>
        
        <main>
            <section id="about">
                <h3>About me</h3>
                <div>skills: Typescript, React</div>
            </section>

            
            <section id="projects">
                <p id="projects-status" role="status"></p>
                <ul id="projects-list"></ul>
                <button id="retry" type="button">Retry</button>
            </section>
            
            <form id="contact">
                <label for="name-input">Name:</label>
                <input id="name-input" name="name" required/>
                <p id="name-error input-error" aria-live="polite"></p>
                
                <label for="email">Email:</label>
                <input id="email" name="email" type="email" required/>
                
                <label for="message">Message:</label>
                <input id="message" name="message"/>

                <button type="submit">Send</button>
            </form>
        </main>
        
        <footer>
            (C) 2026 parkhojeong | <a href="https://github.com/parkhojeong">Github</a>
        </footer>

    </body>


    <script src="./js/api.js"></script>
    <script src="./js/index.js"></script>

</html>
